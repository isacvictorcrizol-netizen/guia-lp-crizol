<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guia de Criação de LP — CRIZOL</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--purple:#4F2D8A;--purple-mid:#7B52D4;--purple-light:#EDE7F6;--green:#0F6E56;--green-light:#E1F5EE;--blue:#185FA5;--blue-light:#E6F1FB;--orange:#993C1D;--orange-light:#FAECE7;--gray:#5F5E5A;--gray-light:#F1EFE8;--amber:#854F0B;--amber-light:#FAEEDA;--text:#1a1a1a;--muted:#666;--border:#e4e0f0;--bg:#F7F5FF;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.hero{background:var(--purple);padding:3.5rem 2rem 2.5rem;text-align:center;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:rgba(123,82,212,.18);top:-180px;right:-120px;pointer-events:none}
.hero-eyebrow{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:.85rem}
.hero h1{font-family:'Syne',sans-serif;font-size:clamp(1.8rem,4.5vw,2.8rem);font-weight:800;color:#fff;line-height:1.15;margin-bottom:.6rem;position:relative}
.hero h1 em{font-style:normal;color:#c4b0f5}
.hero-sub{font-size:.95rem;color:rgba(255,255,255,.6);font-weight:300;max-width:440px;margin:0 auto 1.75rem}
.hero-tags{display:flex;gap:.45rem;justify-content:center;flex-wrap:wrap;position:relative}
.hero-tag{font-size:11px;font-weight:500;padding:3px 12px;border-radius:20px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.18)}
.container{max-width:760px;margin:0 auto;padding:2.5rem 1.25rem 5rem}
.filter-bar{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:2rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border)}
.filter-btn{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:var(--white);color:var(--muted);cursor:pointer;transition:all .15s}
.filter-btn:hover{border-color:var(--purple-mid);color:var(--purple)}
.filter-btn.active{background:var(--purple-light);border-color:var(--purple-mid);color:var(--purple);font-weight:600}
.progress-wrap{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:1rem 1.25rem;margin-bottom:1.75rem;display:flex;align-items:center;gap:1rem}
.progress-label{font-size:13px;color:var(--muted);white-space:nowrap}
.progress-track{flex:1;height:6px;background:#ede8fa;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:var(--purple-mid);border-radius:99px;transition:width .4s ease;width:0%}
.progress-count{font-size:13px;font-weight:600;color:var(--purple);white-space:nowrap}
.section-hdr{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:2rem 0 .75rem;display:flex;align-items:center;gap:.5rem}
.section-hdr::after{content:'';flex:1;height:1px;background:var(--border)}
.step{background:var(--white);border:1px solid var(--border);border-radius:14px;margin-bottom:.65rem;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.step:hover{border-color:#c5b8ea;box-shadow:0 2px 12px rgba(79,45,138,.06)}
.step.done{border-color:#9FE1CB;background:#fbfffd}
.step-head{display:flex;align-items:flex-start;gap:14px;padding:1rem 1.1rem;cursor:pointer}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;cursor:pointer;transition:all .15s;background:var(--white);font-size:13px;color:transparent;user-select:none}
.check:hover{border-color:var(--purple-mid)}
.step.done .check{background:var(--green);border-color:var(--green);color:#fff}
.step-meta{flex:1}
.step-num{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.step-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text);line-height:1.3}
.step.done .step-title{color:var(--gray);text-decoration:line-through;opacity:.7}
.step-sub{font-size:12px;color:var(--muted);margin-top:2px}
.phase-badge{font-size:10px;font-weight:600;letter-spacing:.05em;padding:3px 10px;border-radius:20px;flex-shrink:0;text-transform:uppercase;margin-top:3px}
.chevron{font-size:20px;color:var(--muted);transition:transform .2s;flex-shrink:0;margin-top:2px;line-height:1}
.step.open .chevron{transform:rotate(180deg)}
.step-body{display:none;padding:.75rem 1.1rem 1.1rem;border-top:1px solid #f0ecfa;font-size:14px;color:var(--muted);line-height:1.7}
.step.open .step-body{display:block}
.step-body ul{padding-left:1.1rem;margin:.5rem 0}
.step-body li{margin-bottom:.35rem}
.step-body strong{color:var(--text);font-weight:500}
.step-body code{font-family:'Courier New',monospace;font-size:12px;background:#f0ecfa;color:var(--purple);padding:2px 7px;border-radius:5px}
.step-body a{color:var(--blue);text-decoration:none}
.step-body a:hover{text-decoration:underline}
.tip{margin-top:.75rem;padding:.6rem .85rem;border-radius:8px;font-size:13px;line-height:1.55;border-left:3px solid}
.tip-warn{background:var(--amber-light);border-color:var(--amber);color:#633806}
.tip-info{background:var(--blue-light);border-color:var(--blue);color:#0C447C}
.tip-ok{background:var(--green-light);border-color:var(--green);color:#085041}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:14px}
.footer{text-align:center;padding:2rem;font-size:12px;color:var(--muted);border-top:1px solid var(--border);background:var(--white)}
.footer strong{color:var(--purple)}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-eyebrow">CRIZOL — Central de Recursos · Etapa 2</div>
  <h1>Guia de Criação<br>de <em>Landing Page</em></h1>
  <p class="hero-sub">Passo a passo completo para criar e publicar uma LP de captação de leads do zero.</p>
  <div class="hero-tags">
    <span class="hero-tag">11 etapas</span>
    <span class="hero-tag">Captação de Leads</span>
    <span class="hero-tag">Deploy na Vercel</span>
    <span class="hero-tag">DNS &amp; Domínio</span>
  </div>
</div>

<div class="container">
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-phase="all">Todos</button>
    <button class="filter-btn" data-phase="pre">Pré-projeto</button>
    <button class="filter-btn" data-phase="dev">Desenvolvimento</button>
    <button class="filter-btn" data-phase="deploy">Deploy</button>
    <button class="filter-btn" data-phase="dns">DNS &amp; Domínio</button>
    <button class="filter-btn" data-phase="pos">Pós-lançamento</button>
  </div>

  <div class="progress-wrap">
    <span class="progress-label">Progresso</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-count" id="progressCount">0 / 11</span>
  </div>

  <div id="stepsList"></div>
</div>

<div class="footer">Guia criado para <strong>CRIZOL</strong> &mdash; Criação da LP</div>

<script>
const steps=[
  {phase:"pre",phaseName:"Pré-projeto",phaseColor:"#7F77DD",phaseBg:"#EEEDFE",
   title:"Verificar se o cliente já tem domínio e site",sub:"Ponto de partida de todo projeto",
   body:`<ul><li><strong>Tem site e domínio:</strong> solicite acesso ao repositório e ao painel do registrador (Hostinger, Registro.br etc.).</li><li><strong>Não tem domínio:</strong> oriente o cliente a comprar imediatamente. Sem domínio próprio a LP não terá identidade profissional.</li></ul><div class="tip tip-warn">⚠️ Não avance para o desenvolvimento sem o domínio em mãos — você vai precisar dele na etapa de DNS.</div><ul style="margin-top:.75rem"><li><a href="https://hostinger.com.br" target="_blank">Hostinger</a> — domínios a partir de R$ 15/ano</li><li><a href="https://registro.br" target="_blank">Registro.br</a> — referência para domínios .com.br</li></ul>`},
  {phase:"pre",phaseName:"Pré-projeto",phaseColor:"#7F77DD",phaseBg:"#EEEDFE",
   title:"Definir o cenário: nova LP ou aprimoramento?",sub:"Dois caminhos diferentes a partir daqui",
   body:`<ul><li><strong>Aprimoramento</strong> (cliente já tem LP): siga para o Passo 3.</li><li><strong>Nova LP</strong> (do zero): siga para o Passo 4.</li></ul>`},
  {phase:"dev",phaseName:"Desenvolvimento",phaseColor:"#1D9E75",phaseBg:"#E1F5EE",
   title:"[Aprimoramento] Baixar o repositório atual localmente",sub:"Para clientes que já têm LP e querem melhorias",
   body:`<p>Peça para a IA (Claude ou Codex) clonar os arquivos do site para uma pasta local organizada. Sempre indique o caminho completo ao dar instruções:</p><p style="margin:.6rem 0"><code>C:\\Projetos\\NomeDoCliente</code></p><p>Exemplo de instrução para a IA: <em>"Trabalhe nos arquivos em C:\\Projetos\\Faline — não crie arquivos em outro lugar."</em></p><div class="tip tip-info">ℹ️ Uma pasta por cliente evita confusões e facilita o histórico de versões.</div>`},
  {phase:"dev",phaseName:"Desenvolvimento",phaseColor:"#1D9E75",phaseBg:"#E1F5EE",
   title:"[Nova LP] Escolher e baixar uma estrutura base",sub:"Para clientes sem site ou LP existente",
   body:`<ul><li>Escolha um template gratuito e permitido (<a href="https://html5up.net" target="_blank">HTML5 UP</a>, Carrd, Figma Community etc.).</li><li>Baixe os arquivos (HTML/CSS/JS ou Next.js/React) e salve na pasta local do cliente.</li><li>Peça para a IA personalizar com identidade visual e textos do cliente.</li></ul><div class="tip tip-ok">✅ Informe sempre à IA o diretório de trabalho antes de começar qualquer modificação.</div>`},
  {phase:"dev",phaseName:"Desenvolvimento",phaseColor:"#1D9E75",phaseBg:"#E1F5EE",
   title:"Dar permissão à IA para editar os arquivos locais",sub:"Etapa crítica — sem isso a IA não salva as mudanças",
   body:`<p style="margin-bottom:.6rem"><strong>Claude:</strong> não executa comandos no seu computador por padrão. Duas opções:</p><ul><li>Usar <strong>Claude Code</strong> — instale via <code>npm install -g @anthropic-ai/claude-code</code> e rode no terminal dentro da pasta do projeto.</li><li>Ou copiar o conteúdo dos arquivos no chat, pedir as alterações e substituir manualmente.</li></ul><p style="margin-top:.6rem"><strong>Codex (OpenAI):</strong> funciona via terminal com acesso direto ao sistema de arquivos — basta apontar o diretório.</p><div class="tip tip-warn">⚠️ Nunca dê acesso irrestrito à IA. Conceda permissão apenas para a pasta do projeto específico.</div>`},
  {phase:"dev",phaseName:"Desenvolvimento",phaseColor:"#1D9E75",phaseBg:"#E1F5EE",
   title:"Desenvolver e revisar a LP localmente",sub:"Ciclo de criação e ajustes com a IA",
   body:`<ul><li>Peça as alterações de design, textos e funcionalidades de forma clara e específica.</li><li>Abra o <code>index.html</code> no navegador para visualizar em tempo real.</li><li>Repita até a LP estar aprovada pelo cliente.</li></ul><div class="tip tip-info">ℹ️ Se o projeto usar React ou Next.js, rode <code>npm install</code> e depois <code>npm run dev</code> para visualizar localmente antes de qualquer commit.</div>`},
  {phase:"deploy",phaseName:"Deploy",phaseColor:"#185FA5",phaseBg:"#E6F1FB",
   title:"Criar repositório no GitHub e fazer o push",sub:"Preparar o código para o deploy na Vercel",
   body:`<ul><li>Acesse <a href="https://github.com" target="_blank">github.com</a> e crie um repositório novo (pode ser privado).</li><li>Peça para a IA inicializar o Git e fazer o push:<br><code>git init → git add . → git commit -m "LP inicial" → git push</code></li><li>Informe o link do repositório para a IA. Ex: <code>https://github.com/seuusuario/nome-projeto</code></li></ul><div class="tip tip-ok">✅ Se for React/Next.js, confirme que o <code>package.json</code> está incluído no commit — sem ele a Vercel não instala as dependências e o deploy falha.</div>`},
  {phase:"deploy",phaseName:"Deploy",phaseColor:"#185FA5",phaseBg:"#E6F1FB",
   title:"Importar o repositório na Vercel",sub:"O deploy acontece aqui — em menos de 2 minutos",
   body:`<ul><li>Acesse <a href="https://vercel.com" target="_blank">vercel.com</a> e faça login com a conta do GitHub.</li><li>No painel, clique em <strong>Add New → Project</strong> e selecione o repositório da LP.</li><li>Clique em <strong>Deploy</strong>. A Vercel detecta automaticamente o tipo de projeto.</li></ul><p style="margin-top:.6rem">Após o deploy, a LP fica disponível com endereço temporário: <code>seu-projeto.vercel.app</code></p><div class="tip tip-info">ℹ️ A partir de agora, todo novo push para o GitHub atualiza a LP automaticamente — sem deploy manual.</div>`},
  {phase:"dns",phaseName:"DNS & Domínio",phaseColor:"#993C1D",phaseBg:"#FAECE7",
   title:"Conectar o domínio do cliente na Vercel",sub:"Trocar o endereço temporário pelo domínio real",
   body:`<ul><li>Na Vercel, vá em <strong>Settings → Domains</strong> e adicione o domínio do cliente (ex: <code>seusite.com.br</code>).</li><li>A Vercel vai gerar os registros DNS que você precisa configurar. Anote-os.</li></ul><div class="tip tip-ok">✅ A Vercel entrega dois registros: um <code>A</code> para o domínio raiz e um <code>CNAME</code> para o subdomínio <code>www</code>.</div>`},
  {phase:"dns",phaseName:"DNS & Domínio",phaseColor:"#993C1D",phaseBg:"#FAECE7",
   title:"Criar os registros DNS no registrador do domínio",sub:"Hostinger, HostGator, Registro.br, GoDaddy...",
   body:`<ul><li>Acesse o painel do registrador onde o domínio foi comprado.</li><li>Vá até <strong>Zona DNS</strong> ou <strong>Gerenciar DNS</strong>.</li><li>Crie os registros exatamente como a Vercel indicou — copie e cole sem alterar.</li></ul><div class="tip tip-warn">⚠️ A propagação de DNS pode levar de minutos a 24h. Acompanhe em <a href="https://dnschecker.org" target="_blank">dnschecker.org</a>.</div>`},
  {phase:"pos",phaseName:"Pós-lançamento",phaseColor:"#5F5E5A",phaseBg:"#F1EFE8",
   title:"Validar a LP no ar e corrigir erros",sub:"Testes finais após a propagação do DNS",
   body:`<ul><li>Acesse o domínio real e teste em mobile e desktop.</li><li>Verifique se o formulário de captação está entregando leads no destino certo.</li><li>Confirme que o Pixel do Meta e/ou Google Analytics estão disparando.</li><li>Se houver erros, descreva para a IA — ela consegue debugar código e configuração.</li></ul><div class="tip tip-info">ℹ️ Use o <a href="https://pagespeed.web.dev" target="_blank">PageSpeed Insights</a> para checar a velocidade. Mire acima de 80 no mobile.</div>`}
];

const phaseOrder=["pre","dev","deploy","dns","pos"];
const phaseLabels={pre:"Pré-projeto",dev:"Desenvolvimento",deploy:"Deploy",dns:"DNS & Domínio",pos:"Pós-lançamento"};
let done=new Set(),currentPhase="all";

function updateProgress(){
  const pct=Math.round(done.size/steps.length*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressCount').textContent=done.size+' / '+steps.length;
}

function render(){
  const list=document.getElementById('stepsList');
  list.innerHTML='';
  const filtered=currentPhase==='all'?steps:steps.filter(s=>s.phase===currentPhase);
  if(!filtered.length){list.innerHTML='<div class="empty">Nenhum passo nesta fase.</div>';return}

  const groups={};
  filtered.forEach(s=>{if(!groups[s.phase])groups[s.phase]=[];groups[s.phase].push(s)});
  phaseOrder.filter(p=>groups[p]).forEach(phase=>{
    if(currentPhase==='all'){
      const hdr=document.createElement('div');
      hdr.className='section-hdr';hdr.textContent=phaseLabels[phase];
      list.appendChild(hdr);
    }
    groups[phase].forEach(s=>{
      const idx=steps.indexOf(s);
      const div=document.createElement('div');
      div.className='step'+(done.has(idx)?' done':'');
      div.innerHTML=`<div class="step-head">
        <div class="check" data-check="${idx}">${done.has(idx)?'✓':''}</div>
        <div class="step-meta">
          <div class="step-num">Passo ${idx+1}</div>
          <div class="step-title">${s.title}</div>
          <div class="step-sub">${s.sub}</div>
        </div>
        <span class="phase-badge" style="background:${s.phaseBg};color:${s.phaseColor}">${s.phaseName}</span>
        <div class="chevron">&#8964;</div>
      </div>
      <div class="step-body">${s.body}</div>`;
      div.querySelector('.step-head').addEventListener('click',e=>{
        if(e.target.closest('[data-check]'))return;
        div.classList.toggle('open');
      });
      div.querySelector('[data-check]').addEventListener('click',e=>{
        e.stopPropagation();
        done.has(idx)?done.delete(idx):done.add(idx);
        render();updateProgress();
      });
      list.appendChild(div);
    });
  });
}

document.getElementById('filterBar').addEventListener('click',e=>{
  const btn=e.target.closest('.filter-btn');
  if(!btn)return;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');currentPhase=btn.dataset.phase;render();
});

render();updateProgress();
</script>
</body>
</html>
