<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guia de Criação de LP — CRIZOL</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080808;
  --surface:#111111;
  --surface2:#181818;
  --border:#2a2a2a;
  --border-bright:#3a3a3a;
  --text:#f0f0f0;
  --muted:#888;
  --muted2:#555;
  --silver:#c8c8c8;
  --silver-bright:#e8e8e8;
  --accent:#ffffff;
  --glow:rgba(255,255,255,0.06);
  --green:#1DB97A;
  --green-dim:rgba(29,185,122,0.12);
  --blue:#4A9EFF;
  --blue-dim:rgba(74,158,255,0.12);
  --orange:#FF7A3D;
  --orange-dim:rgba(255,122,61,0.12);
  --amber:#FFB830;
  --amber-dim:rgba(255,184,48,0.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}

/* ── HERO ── */
.hero{
  position:relative;
  padding:5rem 2rem 3.5rem;
  text-align:center;
  overflow:hidden;
  background:#080808;
}
.hero-noise{
  position:absolute;inset:0;
  background-image:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.04) 0%,transparent 65%);
  pointer-events:none;
}
.hero-ring{
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.04);
  pointer-events:none;
}
.hero-ring-1{width:600px;height:600px;top:-300px;left:50%;transform:translateX(-50%)}
.hero-ring-2{width:900px;height:900px;top:-450px;left:50%;transform:translateX(-50%);border-color:rgba(255,255,255,.025)}
.hero-eyebrow{
  font-family:'Syne',sans-serif;
  font-size:10px;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);margin-bottom:1.25rem;
  position:relative;
}
.hero h1{
  font-family:'Syne',sans-serif;
  font-size:clamp(2.2rem,5.5vw,3.8rem);
  font-weight:800;
  color:var(--silver-bright);
  line-height:1.1;
  margin-bottom:.75rem;
  position:relative;
  letter-spacing:-.02em;
}
.hero h1 em{
  font-style:normal;
  background:linear-gradient(135deg,#fff 0%,#aaa 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.hero-sub{
  font-size:.95rem;color:var(--muted);
  font-weight:300;max-width:400px;
  margin:0 auto 2rem;
  position:relative;
  line-height:1.7;
}
.hero-tags{
  display:flex;gap:.4rem;justify-content:center;
  flex-wrap:wrap;position:relative;
}
.hero-tag{
  font-size:11px;font-weight:500;
  padding:4px 13px;border-radius:20px;
  background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.45);
  border:1px solid rgba(255,255,255,.08);
  letter-spacing:.02em;
}

/* ── DIVIDER ── */
.divider{
  height:1px;
  background:linear-gradient(to right,transparent,var(--border),transparent);
}

/* ── CONTAINER ── */
.container{max-width:760px;margin:0 auto;padding:2.5rem 1.25rem 6rem}

/* ── FILTER BAR ── */
.filter-bar{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
.filter-btn{
  font-family:'DM Sans',sans-serif;
  font-size:12px;font-weight:500;
  padding:5px 14px;border-radius:20px;
  border:1px solid var(--border);
  background:transparent;color:var(--muted);
  cursor:pointer;transition:all .15s;
  letter-spacing:.01em;
}
.filter-btn:hover{border-color:var(--border-bright);color:var(--silver)}
.filter-btn.active{
  background:rgba(255,255,255,.07);
  border-color:rgba(255,255,255,.2);
  color:var(--silver-bright);
}

/* ── PROGRESS ── */
.progress-wrap{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:1rem 1.25rem;
  margin-bottom:1.75rem;
  display:flex;align-items:center;gap:1rem;
}
.progress-label{font-size:13px;color:var(--muted);white-space:nowrap}
.progress-track{flex:1;height:4px;background:var(--border);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(to right,#888,#fff);border-radius:99px;transition:width .4s ease;width:0%}
.progress-count{font-size:13px;font-weight:600;color:var(--silver);white-space:nowrap}

/* ── SECTION HEADER ── */
.section-hdr{
  font-family:'Syne',sans-serif;
  font-size:10px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted2);
  margin:2rem 0 .75rem;
  display:flex;align-items:center;gap:.75rem;
}
.section-hdr::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── STEP ── */
.step{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:.5rem;
  overflow:hidden;
  transition:border-color .2s,background .2s;
}
.step:hover{border-color:var(--border-bright);background:var(--surface2)}
.step.done{border-color:rgba(29,185,122,.25);background:rgba(29,185,122,.04)}
.step-head{display:flex;align-items:flex-start;gap:14px;padding:1rem 1.1rem;cursor:pointer}

/* CHECK */
.check{
  width:26px;height:26px;border-radius:50%;
  border:1px solid var(--border-bright);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:2px;cursor:pointer;
  transition:all .15s;background:transparent;
  font-size:12px;color:transparent;user-select:none;
}
.check:hover{border-color:var(--silver);background:var(--glow)}
.step.done .check{background:var(--green);border-color:var(--green);color:#000;font-size:13px}

.step-meta{flex:1;min-width:0}
.step-num{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);margin-bottom:2px}
.step-title{
  font-family:'Syne',sans-serif;
  font-size:14px;font-weight:700;
  color:var(--silver-bright);line-height:1.3;
}
.step.done .step-title{color:var(--muted);text-decoration:line-through}
.step-sub{font-size:12px;color:var(--muted);margin-top:2px}

.phase-badge{
  font-size:10px;font-weight:600;letter-spacing:.04em;
  padding:3px 10px;border-radius:20px;flex-shrink:0;
  text-transform:uppercase;margin-top:3px;
  white-space:nowrap;
}
.chevron{font-size:18px;color:var(--muted2);transition:transform .2s;flex-shrink:0;margin-top:3px;line-height:1}
.step.open .chevron{transform:rotate(180deg)}

/* BODY */
.step-body{
  display:none;
  padding:.75rem 1.1rem 1.1rem;
  border-top:1px solid var(--border);
  font-size:13.5px;color:var(--muted);line-height:1.75;
}
.step.open .step-body{display:block}
.step-body ul{padding-left:1.1rem;margin:.5rem 0}
.step-body li{margin-bottom:.4rem}
.step-body strong{color:var(--silver);font-weight:500}
.step-body code{
  font-family:'Courier New',monospace;font-size:12px;
  background:rgba(255,255,255,.06);
  color:var(--silver-bright);
  padding:2px 7px;border-radius:5px;
  border:1px solid var(--border);
}
.step-body a{color:var(--blue);text-decoration:none}
.step-body a:hover{text-decoration:underline}
.step-body p{margin-bottom:.4rem}

/* TIPS */
.tip{margin-top:.75rem;padding:.65rem .9rem;border-radius:8px;font-size:13px;line-height:1.6;border-left:2px solid}
.tip-warn{background:var(--amber-dim);border-color:var(--amber);color:#d4a000}
.tip-info{background:var(--blue-dim);border-color:var(--blue);color:#6ab4ff}
.tip-ok{background:var(--green-dim);border-color:var(--green);color:#1DB97A}
.tip a{color:inherit;text-decoration:underline}

/* FOOTER */
.footer{
  text-align:center;padding:2rem;
  font-size:12px;color:var(--muted2);
  border-top:1px solid var(--border);
  letter-spacing:.02em;
}
.footer strong{color:var(--muted)}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-noise"></div>
  <div class="hero-ring hero-ring-1"></div>
  <div class="hero-ring hero-ring-2"></div>
  <div class="hero-eyebrow">CRIZOL — Central de Recursos &nbsp;·&nbsp; Etapa 2</div>
  <h1>Guia de Criação<br>de <em>Landing Page</em></h1>
  <p class="hero-sub">Passo a passo completo para criar e publicar uma LP de captação de leads do zero.</p>
  <div class="hero-tags">
    <span class="hero-tag">11 etapas</span>
    <span class="hero-tag">Captação de Leads</span>
    <span class="hero-tag">Deploy na Vercel</span>
    <span class="hero-tag">DNS &amp; Domínio</span>
  </div>
</div>

<div class="divider"></div>

<div class="container">
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-phase="all">Todos</button>
    <button class="filter-btn" data-phase="pre">Pré-projeto</button>
    <button class="filter-btn" data-phase="dev">Desenvolvimento</button>
    <button class="filter-btn" data-phase="deploy">Deploy</button>
    <button class="filter-btn" data-phase="dns">DNS &amp; Domínio</button>
    <button class="filter-btn" data-phase="pos">Pós-lançamento</button>
  </div>

  <div class="progress-wrap">
    <span class="progress-label">Progresso</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-count" id="progressCount">0 / 11</span>
  </div>

  <div id="stepsList"></div>
</div>

<div class="footer">Guia criado para <strong>CRIZOL</strong> &mdash; Criação da LP</div>

<script>
const C={
  pre:{name:"Pré-projeto",color:"#888",bg:"rgba(255,255,255,0.07)",text:"#ccc"},
  dev:{name:"Desenvolvimento",color:"#1DB97A",bg:"rgba(29,185,122,0.1)",text:"#1DB97A"},
  deploy:{name:"Deploy",color:"#4A9EFF",bg:"rgba(74,158,255,0.1)",text:"#4A9EFF"},
  dns:{name:"DNS & Domínio",color:"#FF7A3D",bg:"rgba(255,122,61,0.1)",text:"#FF7A3D"},
  pos:{name:"Pós-lançamento",color:"#FFB830",bg:"rgba(255,184,48,0.1)",text:"#FFB830"},
};

const steps=[
  {phase:"pre",title:"Verificar se o cliente já tem domínio e site",sub:"Ponto de partida de todo projeto",
   body:`<ul><li><strong>Tem site e domínio:</strong> solicite acesso ao repositório e ao painel do registrador (Hostinger, Registro.br etc.).</li><li><strong>Não tem domínio:</strong> oriente o cliente a comprar imediatamente. Sem domínio próprio a LP não terá identidade profissional.</li></ul><div class="tip tip-warn">⚠️ Não avance para o desenvolvimento sem o domínio em mãos — você vai precisar dele na etapa de DNS.</div><ul style="margin-top:.75rem"><li><a href="https://hostinger.com.br" target="_blank">Hostinger</a> — domínios a partir de R$ 15/ano</li><li><a href="https://registro.br" target="_blank">Registro.br</a> — referência para domínios .com.br</li></ul>`},
  {phase:"pre",title:"Definir o cenário: nova LP ou aprimoramento?",sub:"Dois caminhos diferentes a partir daqui",
   body:`<ul><li><strong>Aprimoramento</strong> (cliente já tem LP): siga para o Passo 3.</li><li><strong>Nova LP</strong> (do zero): siga para o Passo 4.</li></ul>`},
  {phase:"dev",title:"[Aprimoramento] Baixar o repositório atual localmente",sub:"Para clientes que já têm LP e querem melhorias",
   body:`<p>Peça para a IA (Claude ou Codex) clonar os arquivos para uma pasta local organizada. Sempre indique o caminho completo ao dar instruções:</p><p style="margin:.5rem 0"><code>C:\\Projetos\\NomeDoCliente</code></p><p>Exemplo: <em>"Trabalhe nos arquivos em C:\\Projetos\\Faline — não crie arquivos em outro lugar."</em></p><div class="tip tip-info">ℹ️ Uma pasta por cliente evita confusões e facilita o histórico de versões.</div>`},
  {phase:"dev",title:"[Nova LP] Escolher e baixar uma estrutura base",sub:"Para clientes sem site ou LP existente",
   body:`<ul><li>Escolha um template gratuito e permitido (<a href="https://html5up.net" target="_blank">HTML5 UP</a>, Carrd, Figma Community etc.).</li><li>Baixe os arquivos (HTML/CSS/JS ou Next.js/React) e salve na pasta local do cliente.</li><li>Peça para a IA personalizar com identidade visual e textos do cliente.</li></ul><div class="tip tip-ok">✅ Informe sempre à IA o diretório de trabalho antes de qualquer modificação.</div>`},
  {phase:"dev",title:"Dar permissão à IA para editar os arquivos locais",sub:"Etapa crítica — sem isso a IA não salva as mudanças",
   body:`<p style="margin-bottom:.5rem"><strong>Claude:</strong> não executa comandos no seu computador por padrão. Duas opções:</p><ul><li>Usar <strong>Claude Code</strong> — instale via <code>npm install -g @anthropic-ai/claude-code</code> e rode no terminal dentro da pasta do projeto.</li><li>Ou copiar o conteúdo dos arquivos no chat, pedir as alterações e substituir manualmente.</li></ul><p style="margin-top:.5rem"><strong>Codex (OpenAI):</strong> funciona via terminal com acesso direto ao sistema de arquivos — basta apontar o diretório.</p><div class="tip tip-warn">⚠️ Nunca dê acesso irrestrito à IA. Conceda permissão apenas para a pasta do projeto específico.</div>`},
  {phase:"dev",title:"Desenvolver e revisar a LP localmente",sub:"Ciclo de criação e ajustes com a IA",
   body:`<ul><li>Peça as alterações de design, textos e funcionalidades de forma clara e específica.</li><li>Abra o <code>index.html</code> no navegador para visualizar em tempo real.</li><li>Repita até a LP estar aprovada pelo cliente.</li></ul><div class="tip tip-info">ℹ️ Se o projeto usar React ou Next.js, rode <code>npm install</code> e depois <code>npm run dev</code> para visualizar localmente antes de qualquer commit.</div>`},
  {phase:"deploy",title:"Criar repositório no GitHub e fazer o push",sub:"Preparar o código para o deploy na Vercel",
   body:`<ul><li>Acesse <a href="https://github.com" target="_blank">github.com</a> e crie um repositório novo (pode ser privado).</li><li>Peça para a IA inicializar o Git e fazer o push:<br><code>git init → git add . → git commit -m "LP inicial" → git push</code></li><li>Informe o link do repositório para a IA. Ex: <code>https://github.com/seuusuario/nome-projeto</code></li></ul><div class="tip tip-ok">✅ Se for React/Next.js, confirme que o <code>package.json</code> está no commit — sem ele a Vercel não instala as dependências e o deploy falha.</div>`},
  {phase:"deploy",title:"Importar o repositório na Vercel",sub:"O deploy acontece aqui — em menos de 2 minutos",
   body:`<ul><li>Acesse <a href="https://vercel.com" target="_blank">vercel.com</a> e faça login com a conta do GitHub.</li><li>No painel, clique em <strong>Add New → Project</strong> e selecione o repositório da LP.</li><li>Clique em <strong>Deploy</strong>. A Vercel detecta automaticamente o tipo de projeto.</li></ul><p style="margin-top:.5rem">Após o deploy, a LP fica disponível com endereço temporário: <code>seu-projeto.vercel.app</code></p><div class="tip tip-info">ℹ️ A partir de agora, todo novo push para o GitHub atualiza a LP automaticamente — sem deploy manual.</div>`},
  {phase:"dns",title:"Conectar o domínio do cliente na Vercel",sub:"Trocar o endereço temporário pelo domínio real",
   body:`<ul><li>Na Vercel, vá em <strong>Settings → Domains</strong> e adicione o domínio (ex: <code>seusite.com.br</code>).</li><li>A Vercel vai gerar os registros DNS. Anote-os.</li></ul><div class="tip tip-ok">✅ A Vercel entrega dois registros: um <code>A</code> para o domínio raiz e um <code>CNAME</code> para o <code>www</code>.</div>`},
  {phase:"dns",title:"Criar os registros DNS no registrador do domínio",sub:"Hostinger, HostGator, Registro.br, GoDaddy...",
   body:`<ul><li>Acesse o painel do registrador onde o domínio foi comprado.</li><li>Vá até <strong>Zona DNS</strong> ou <strong>Gerenciar DNS</strong>.</li><li>Crie os registros exatamente como a Vercel indicou — copie e cole sem alterar.</li></ul><div class="tip tip-warn">⚠️ A propagação de DNS pode levar de minutos a 24h. Acompanhe em <a href="https://dnschecker.org" target="_blank">dnschecker.org</a>.</div>`},
  {phase:"pos",title:"Validar a LP no ar e corrigir erros",sub:"Testes finais após a propagação do DNS",
   body:`<ul><li>Acesse o domínio real e teste em mobile e desktop.</li><li>Verifique se o formulário está entregando leads no destino certo.</li><li>Confirme que o Pixel do Meta e/ou Google Analytics estão disparando.</li><li>Se houver erros, descreva para a IA — ela consegue debugar código e configuração.</li></ul><div class="tip tip-info">ℹ️ Use o <a href="https://pagespeed.web.dev" target="_blank">PageSpeed Insights</a> para checar a velocidade. Mire acima de 80 no mobile.</div>`}
];

const phaseOrder=["pre","dev","deploy","dns","pos"];
let done=new Set(),currentPhase="all";

function updateProgress(){
  const pct=Math.round(done.size/steps.length*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressCount').textContent=done.size+' / '+steps.length;
}

function render(){
  const list=document.getElementById('stepsList');
  list.innerHTML='';
  const filtered=currentPhase==='all'?steps:steps.filter(s=>s.phase===currentPhase);
  if(!filtered.length){list.innerHTML='<div style="text-align:center;padding:3rem;color:#555;font-size:14px">Nenhum passo nesta fase.</div>';return}
  const groups={};
  filtered.forEach(s=>{if(!groups[s.phase])groups[s.phase]=[];groups[s.phase].push(s)});
  phaseOrder.filter(p=>groups[p]).forEach(phase=>{
    if(currentPhase==='all'){
      const hdr=document.createElement('div');
      hdr.className='section-hdr';hdr.textContent=C[phase].name;
      list.appendChild(hdr);
    }
    groups[phase].forEach(s=>{
      const idx=steps.indexOf(s);
      const c=C[phase];
      const div=document.createElement('div');
      div.className='step'+(done.has(idx)?' done':'');
      div.innerHTML=`<div class="step-head">
        <div class="check" data-check="${idx}">${done.has(idx)?'✓':''}</div>
        <div class="step-meta">
          <div class="step-num">Passo ${idx+1}</div>
          <div class="step-title">${s.title}</div>
          <div class="step-sub">${s.sub}</div>
        </div>
        <span class="phase-badge" style="background:${c.bg};color:${c.text};border:1px solid ${c.color}22">${c.name}</span>
        <div class="chevron">&#8964;</div>
      </div>
      <div class="step-body">${s.body}</div>`;
      div.querySelector('.step-head').addEventListener('click',e=>{
        if(e.target.closest('[data-check]'))return;
        div.classList.toggle('open');
      });
      div.querySelector('[data-check]').addEventListener('click',e=>{
        e.stopPropagation();
        done.has(idx)?done.delete(idx):done.add(idx);
        render();updateProgress();
      });
      list.appendChild(div);
    });
  });
}

document.getElementById('filterBar').addEventListener('click',e=>{
  const btn=e.target.closest('.filter-btn');
  if(!btn)return;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');currentPhase=btn.dataset.phase;render();
});

render();updateProgress();
</script>
</body>
</html>
